# =====================================================================
#  Student Management System - application configuration
#  Change these values to match YOUR MySQL 8 installation.
# =====================================================================

# JDBC URL for MySQL (credentials can be overridden with DB_USERNAME/DB_PASSWORD)
db.url=jdbc:mysql://localhost:3306/student_management
db.user=root
db.password=

# Application identity
app.name=Student Management System
app.version=1.0.0
app.college=B.Tech CSE Major Project

# Session timeout in minutes (informational; used by the status bar)
app.session.timeout=60

# Export folder suggestion (used as the default file chooser folder)
app.export.folder=exports

# Browser application
server.port=8081
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
